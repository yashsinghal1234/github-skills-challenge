name: Python Coverage
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install testing and coverage tools
        run: |
          python -m pip install pytest==8.4.1 coverage==7.16.1 pytest-cov==7.1.0

      - name: Run tests and generate coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publish coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Enforce minimum coverage
        run: python -m coverage report --fail-under=90